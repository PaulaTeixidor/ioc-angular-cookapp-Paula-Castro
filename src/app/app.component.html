<main class="main-container">
  <header>
    <h1>CookApp</h1>
    <p>Descubre y organiza tus recetas favoritas.</p>
  </header>

  <app-receta-filter
    (filtroCambiado)="filtrarRecetas($event)"
  />

  <h2>Catálogo de recetas</h2>

  <app-receta-list
    [recetas]="recetasFiltradas"
    (recetaSeleccionada)="seleccionarReceta($event)"
  />

  @if (recetaSeleccionada) {
    <section class="detalle">
      <h2>Receta seleccionada</h2>
      <h3>{{ recetaSeleccionada.nombre }}</h3>
      <p>{{ recetaSeleccionada.descripcion }}</p>
    </section>
  }
</main>
