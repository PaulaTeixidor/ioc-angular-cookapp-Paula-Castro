<div class="filtros">
  <label for="categoria">Filtrar por categoría:</label>

  <select
    id="categoria"
    [(ngModel)]="categoriaSeleccionada"
    (change)="aplicarFiltro()"
  >
    <option value="">Todas las recetas</option>

    @for (categoria of categorias; track categoria) {
      <option [value]="categoria">
        {{ categoria }}
      </option>
    }
  </select>
</div>
