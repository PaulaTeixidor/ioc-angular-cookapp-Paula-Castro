<section class="receta-list">

  @if (recetas.length > 0) {

    @for (receta of recetas; track receta.id) {
      <app-receta-card
        [receta]="receta"
        (recetaSeleccionada)="seleccionarReceta($event)"
      />
    }

  } @else {

    <p class="mensaje-vacio">
      No se han encontrado recetas.
      Prueba  modificar los filtros.
    </p>

  }

</section>
